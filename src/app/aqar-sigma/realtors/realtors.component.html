<div class="row mb-3 ps-3">
  <div class="col-md-4">
    <select class="form-select form-select-sm border-info" [(ngModel)]="selectedCityId">
      <option [ngValue]="null">{{ (language$ | async) === 'en' ? 'All Cities' : 'جميع المدن' }}</option>
      <option *ngFor="let city of cities" [ngValue]="city.id">
        {{ (language$ | async) === 'en' ? city.nameEn : (city.nameAr || city.nameEn) }}
      </option>
    </select>
  </div>
  <div class="col-md-4">
    <select class="form-select form-select-sm border-info" [(ngModel)]="selectedDistrictId" (ngModelChange)="onDistrictChange($event)" [disabled]="!districts.length">
      <option [ngValue]="null">{{ (language$ | async) === 'en' ? 'All Districts' : 'جميع المناطق' }}</option>
      <option *ngFor="let district of districts" [ngValue]="district.id">
        {{ (language$ | async) === 'en' ? district.nameEn : (district.nameAr || district.nameEn) }}
      </option>
    </select>
  </div>
</div>

<div class="row">
  <div *ngFor="let realtor of filteredRealtors" class="col-12 col-md-4 mb-4 text-center">
    <div style="cursor:pointer" (click)="goToRealtorAccount(realtor)">
      <img
        [src]="getProfilePhotoSrc(realtor.profilePhoto || realtor.profilePhotoUrl)"
        class="rounded-circle border border-2"
        style="width: 180px !important; height: 180px !important; object-fit: cover; box-shadow: 0 0 8px #ccc;">
      <div class="fw-bold mt-2" style="font-size: 1em;">
        {{ realtor.firstName }}<br>{{ realtor.lastName }}
      </div>
    </div>
  </div>
</div>
